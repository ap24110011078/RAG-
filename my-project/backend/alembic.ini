# Alembic configuration for RAG Document Intelligence backend.
# The database URL is NOT stored here — it is read from the environment /
# Settings object inside env.py so no credentials are ever committed.

[alembic]
# Path to migrations package, relative to this file.
script_location = app/db/migrations

# Naming convention applied to autogenerated migration file names.
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d_%(rev)s_%(slug)s.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Controls how much of the generated SQL Alembic outputs.
# We keep this off by default; use -v flag on the CLI when needed.
truncate_slug_length = 40

# Use timezone-aware timestamps in revision files.
timezone = UTC

# Ensure new Python source files generated by Alembic have the right encoding.
output_encoding = utf-8

# prepend_sys_path lets alembic import our app modules.
# "." means the backend/ directory (where alembic.ini lives).
prepend_sys_path = .


[post_write_hooks]
# Optional: format generated migration files with ruff if it is installed.
# hooks = ruff
# ruff.type = fix
# ruff.options = --select I

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
